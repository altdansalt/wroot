[package]
name = "wasmdev-host"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "49", default-features = false, features = ["cranelift", "cache", "parallel-compilation", "runtime", "std", "async", "pooling-allocator", "anyhow", "wat", "component-model", "addr2line", "demangle"] }
wasmtime-wasi = "49"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }

[profile.release]
opt-level = 2
codegen-units = 16
incremental = false
debug = false

# wasmtime-wasi 49 has no WASIp1 socket support; we carry a small patch
# (vendor/wasmtime-wasi/src/p1_socket.rs). See docs/HOST_CAPABILITIES.md.
[patch.crates-io]
wasmtime-wasi = { path = "vendor/wasmtime-wasi" }
